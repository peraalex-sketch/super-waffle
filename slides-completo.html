<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Slides Instagram - Dra. Tânia Pera</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: #003366;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      overflow: hidden;
    }
    
    .container {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #003366;
      padding: 10px;
    }
    
    .slide-viewer {
      width: 100%;
      max-width: 600px;
      aspect-ratio: 4/5;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .slide-viewer img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .controls {
      display: flex;
      gap: 15px;
      margin-top: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }
    
    .btn {
      padding: 12px 20px;
      border: 2px solid #d4af37;
      background: #003366;
      color: #d4af37;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s;
    }
    
    .btn:hover {
      background: #d4af37;
      color: #003366;
    }
    
    .btn:active {
      transform: scale(0.95);
    }
    
    .slide-number {
      color: #d4af37;
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      font-weight: bold;
    }
    
    .btn-download {
      background: #d4af37;
      color: #003366;
      border-color: #d4af37;
    }
    
    .btn-download:hover {
      background: #003366;
      color: #d4af37;
    }
    
    @media (max-width: 600px) {
      .slide-viewer {
        max-width: 90vw;
      }
      .btn {
        padding: 10px 15px;
        font-size: 12px;
      }
    }
  </style>
</head>

  <div class="container">
    <h1 style="color: #d4af37; margin-bottom: 20px; text-align: center;">
      📱 Slides para Instagram<br>
      <span style="font-size: 18px; font-weight: normal;">Dra. Tânia Pera</span>
    </h1>
    
    <div class="slide-viewer">
      <img id="slideImg" src="" alt="Slide">
    </div>
    
    <div class="slide-number">

    </div>
    
    <div class="controls">
      <button class="btn" onclick="previousSlide()">← Anterior</button>
      <button class="btn" onclick="nextSlide()">Próximo →</button>
      <button class="btn btn-download" onclick="downloadSlide()">⬇️ Baixar</button>
    </div>
  </div>

    let currentSlide = 1;
    
    function showSlide(num) {
      currentSlide = num;
      document.getElementById('slideImg').src = slides[currentSlide];
      document.getElementById('slideNum').textContent = currentSlide;
    }
    
    function nextSlide() {
      if (currentSlide < 5) {
        showSlide(currentSlide + 1);
      } else {
        showSlide(1);
      }
    }
    
    function previousSlide() {
      if (currentSlide > 1) {
        showSlide(currentSlide - 1);
      } else {
        showSlide(5);
      }
    }
    
    function downloadSlide() {
      const link = document.createElement('a');
      link.href = slides[currentSlide];
      link.download = `slide-${currentSlide}-dra-tania-pera.jpg`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
    
    // Teclado
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') nextSlide();
      if (e.key === 'ArrowLeft') previousSlide();
    });
    
    // Inicializar
    showSlide(1);
